<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material de Estudo</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Script para customização das cores do Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bege-retro': '#F7F3E9',
            'rosa-pastel': '#F8DAE2',
            'magenta-suave': '#B3395B',
            'pink-destaque': '#FF2A75',
            'dark-slate': '#2B2A2A',
          }
        }
      }
    }
  </script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- CSS Customizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bege-retro text-dark-slate font-sans antialiased min-h-screen flex flex-col transition-all duration-300">

  <!-- Header / Navbar -->
  <header class="bg-rosa-pastel border-b border-magenta-suave/20 sticky top-0 z-40 shadow-sm backdrop-blur-md bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-pink-destaque text-white rounded-xl shadow-md">
          <i class="ph ph-book-open text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-magenta-suave leading-tight">Painel de Estudos</h1>
          <p class="text-xs text-magenta-suave/80 font-medium">Sua central de resumos, conceitos e anotações</p>
        </div>
      </div>

      <!-- Quick Actions Bar -->
      <div class="flex items-center space-x-2">
        <!-- Size Controls -->
        <div class="flex items-center bg-white/60 border border-magenta-suave/20 rounded-lg p-1">
          <button id="font-decrease" class="p-1 hover:bg-rosa-pastel rounded text-magenta-suave" title="Diminuir Fonte">
            <i class="ph ph-text-shrink text-lg"></i>
          </button>
          <button id="font-increase" class="p-1 hover:bg-rosa-pastel rounded text-magenta-suave" title="Aumentar Fonte">
            <i class="ph ph-text-expand text-lg"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Subheader / Controles de Filtro e Busca -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
    <div class="bg-white/80 backdrop-blur border border-magenta-suave/10 rounded-2xl p-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- Campo de Busca -->
      <div class="relative w-full md:w-80">
        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-magenta-suave/60 text-lg"></i>
        <input type="text" id="search-input" placeholder="Buscar por termo, tag ou título..." 
               class="w-full pl-10 pr-4 py-2 bg-bege-retro/60 border border-magenta-suave/20 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-destaque focus:border-transparent transition-all">
      </div>

      <!-- Filtros por Categoria -->
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto" id="category-filters">
        <button class="filter-btn active" data-category="all">Todos</button>
        <button class="filter-btn" data-category="javascript">JavaScript</button>
        <button class="filter-btn" data-category="css">CSS / Tailwind</button>
        <button class="filter-btn" data-category="teoria">Conceitos</button>
        <button class="filter-btn" data-category="atribuitos">Atalhos</button>
      </div>

    </div>
  </section>

  <!-- Conteúdo Principal / Grid de Cartões -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 font-size-base">
      <!-- Os cartões serão inseridos dinamicamente pelo JS -->
    </div>

    <!-- Feedback caso não encontre busca -->
    <div id="no-results" class="hidden text-center py-16">
      <i class="ph ph-magnifying-glass-plus text-5xl text-magenta-suave/40 mb-3 block"></i>
      <p class="text-magenta-suave font-medium">Nenhum conteúdo encontrado para essa busca.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-rosa-pastel/50 border-t border-magenta-suave/10 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-magenta-suave/80">
      <p>Desenvolvido para facilitar seus estudos diários.</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
